name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type check · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4（pin SHA，符合 A16 Actions pin）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4（pin SHA）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Check (tsc + ESLint + Vitest)
        run: npm run check
      - name: Build
        run: npm run build
